# carr-system nightly backup — PROGRAM 4, THE MAC-INDEPENDENT COPY.
# Joe-approved, 2026-08-14.
#
# WHY THIS EXISTS. The only nightly backup that has ever run is
# bin/nightly.sh -> bin/backup-dump.sh on Joe's own Mac. That means the
# backup of last resort depends on the exact machine everything else
# depends on: if the Mac is off, asleep, or dead overnight, there is no new
# encrypted dump that night, and nothing surfaces the gap until a restore
# actually needs it. This workflow is a second, independent nightly dump —
# same encryption (age, the repo's tracked public key in
# backups-public-key.txt), running on GitHub's infrastructure instead of
# Joe's, stored as a 90-day workflow artifact instead of the R2 archive, so
# the two paths share no single point of failure.
#
# SAME SCRIPT, NOT A SECOND IMPLEMENTATION (rule a8c55a47: a manual path and
# an automated path doing the same job must be the same code). This
# workflow calls bin/backup-dump.sh completely unmodified in its command
# logic. Three env vars — BACKUP_DATABASE_URL, BACKUP_SKIP_R2,
# BACKUP_OUTPUT_DIR — switch the script onto this path without touching
# what runs on Joe's Mac every night; all three are unset there, so the
# local nightly is byte-identical to before this file existed.
#
# READ-ONLY, DEDICATED CREDENTIAL. Connects as carr_backup
# (migrations/0119_backup_role.sql): SELECT on every table in the CARR-owned
# public and ops schemas, now and future, and nothing else — no
# INSERT/UPDATE/DELETE/DDL anywhere, not a member of
# carr_writer/carr_reader/carr_jobs. bin/backup-dump.sh scopes pg_dump to those
# same schemas; Neon-managed neon_auth is deliberately outside this artifact.
# A leaked
# BACKUP_DATABASE_URL secret can produce a read-only copy of the database # ci-secret-scan: allow — documentation, not a credential
# and nothing more.
#
# PROVISIONING IS DISABLED. Migration 0119 created carr_backup with an
# unrecorded placeholder, but no sanctioned path currently exists to set its
# password or BACKUP_DATABASE_URL. Do NOT run direct ALTER ROLE commands, do
# NOT set the GitHub secret, and do NOT enable this schedule. A caller-provided
# approval string is not authority: provisioning/rotation stays disabled until
# a canonical server-validated immutable receipt binds Joe's approval and the
# metering admission to this exact target and credential material.
#
# Until that receipt seam is designed, a scheduled invocation stays neutral at
# the gate below and manual dispatch is not a provisioning substitute. Merging
# this file therefore cannot authorize a credential mutation or cloud backup.
#
# ACTIONS ARE PINNED TO COMMIT SHAs, not tags — same rule and the same two
# pins ci.yml and automerge-pilot.yml already use.

name: Nightly backup (cloud)

on:
  schedule:
    # 02:35 UTC. Joe's local nightly chain runs at 02:05 LOCAL time
    # (bin/nightly.sh) — deliberately offset so the two independent backups
    # never land in the same minute of GitHub's scheduler queue or the same
    # moment against Neon.
    - cron: "35 2 * * *"
  workflow_dispatch: {}

concurrency:
  group: carr-nightly-backup-cloud
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    name: pg_dump -> age-encrypt -> artifact
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Gate the schedule on CARR_CLOUD_BACKUP_ENABLED
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ vars.CARR_CLOUD_BACKUP_ENABLED }}" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "CARR_CLOUD_BACKUP_ENABLED is not 'true' and this is a scheduled run — exiting neutral-success, nothing ran."
            echo "Cloud backup provisioning is disabled pending a canonical server-validated receipt seam; do not treat workflow_dispatch as a provisioning path."
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.enabled == 'true'

      - name: Install postgresql-client-18 (PGDG apt repo) and age
        if: steps.gate.outputs.enabled == 'true'
        # Ubuntu's own default postgresql-client is well behind Postgres 18
        # (the Neon server version), and pg_dump refuses to dump a server
        # newer than itself — this is the one dependency that cannot be a
        # version mismatch. The PGDG repo is the project's own; the
        # codename is read from the runner's own /etc/os-release rather
        # than hardcoded so this keeps working if/when ubuntu-latest moves
        # to a newer LTS. zsh: bin/backup-dump.sh's shebang, same reason
        # ci.yml installs it for bin/review-council-runner.sh. age: Ubuntu's
        # own universe repo carries it; no PGDG dependency for that one.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl ca-certificates gnupg zsh age
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          CODENAME="$(. /etc/os-release && echo "$VERSION_CODENAME")"
          printf 'Types: deb\nURIs: https://apt.postgresql.org/pub/repos/apt\nSuites: %s-pgdg\nComponents: main\nSigned-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc\n' \
            "$CODENAME" | sudo tee /etc/apt/sources.list.d/pgdg.sources > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-18
          # The runner image PREINSTALLS an older postgresql-client at
          # /usr/bin, and it kept winning PATH over the PGDG install — the
          # first live dispatch (run 31809578546, 2026-08-14) died with
          # "aborting because of server version mismatch" exactly this way.
          # GITHUB_PATH prepends for every LATER step, so the dump step's
          # pg_dump resolves to 18; the assertion below fails THIS step
          # loudly if the layout ever changes instead of letting the dump
          # step rediscover the mismatch.
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/18/bin/pg_dump --version
          age --version

      - name: Dump, age-encrypt, and check the size floor
        if: steps.gate.outputs.enabled == 'true'
        env:
          # Never inline a secret into a run: command — env indirection only,
          # same as CARR_CI_DATABASE_URL in ci.yml / automerge-pilot.yml.
          # Not a literal credential (a GitHub secret reference), so
          # ops/ci-secret-scan.py's dsn-with-password pattern does not match
          # this line and no inline allow marker is needed.
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          # The runner's disk dies with the job: no local copy to keep, and
          # no reason to spend the R2 quota on a dump that is about to
          # become the workflow artifact below.
          BACKUP_SKIP_R2: "1"
          BACKUP_OUTPUT_DIR: ${{ github.workspace }}/backup-out
        run: zsh bin/backup-dump.sh
        # No separate "verify the size floor" step: bin/backup-dump.sh exits
        # nonzero on a short dump (see its own SIZE FLOOR comment) and a
        # failed step here skips every step below by GitHub Actions' own
        # default — the corrupt/incomplete dump never reaches the artifact
        # upload.

      - name: Confirm the size floor passed
        if: steps.gate.outputs.enabled == 'true'
        run: |
          echo "size-floor guard passed (bin/backup-dump.sh would have exited nonzero above otherwise) — uploading."
          ls -la "${{ github.workspace }}/backup-out"

      - name: Compute the artifact name (YYYYMMDD, UTC — matches the dump's own STAMP)
        if: steps.gate.outputs.enabled == 'true'
        id: stamp
        run: echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Upload the encrypted dump as a workflow artifact
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: carr-backup-${{ steps.stamp.outputs.date }}
          path: ${{ github.workspace }}/backup-out/carr-*.sql.age
          if-no-files-found: error
          retention-days: 90

      # ── the second Mac-independent copy ──────────────────────────────────
      # The artifact above is one off-Mac copy with a 90-day ceiling GitHub
      # sets, not us. R2 is the copy we control the retention of, and until
      # now every R2 backup object was written BY Joe's Mac — so a lost Mac
      # meant no new copies anywhere. This step closes that: a scoped token
      # (Object Read & Write, carr-documents only, minted 2026-08-14) lets the
      # runner archive the same encrypted artifact it just proved.
      #
      # The key path deliberately says cloud/: a reader listing the bucket can
      # tell at a glance which copies came from the Mac's nightly chain and
      # which from this workflow, without opening either.
      #
      # SKIPS, never fails, when the token is absent — the artifact copy above
      # has already succeeded by the time we reach here, and losing the second
      # copy is not a reason to report the backup itself as broken. The log
      # line says which happened, so a silent skip is not mistaken for a
      # silent success.
      - name: Archive the encrypted dump to R2 (second off-Mac copy)
        if: steps.gate.outputs.enabled == 'true'
        env:
          # S3-compatible credentials, NOT the REST API token. A bucket-scoped
          # R2 token ("Object Read & Write" on carr-documents alone) does not
          # authorize wrangler's REST path
          # /accounts/<id>/r2/buckets/<bucket>/objects/<key> — two live runs on
          # 2026-08-14 (31837806854, 31838603722) both returned 403 there, the
          # second with a freshly minted token, which ruled out a bad value and
          # left the permission model as the cause. That REST path wants
          # account-wide Workers R2 Storage Write. The S3 endpoint honors the
          # narrow per-bucket grant, so the scope stays tight and the tooling
          # changes instead.
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          STAMP: ${{ steps.stamp.outputs.date }}
        run: |
          if [ -z "${AWS_ACCESS_KEY_ID:-}" ] || [ -z "${AWS_SECRET_ACCESS_KEY:-}" ] || [ -z "${ACCOUNT_ID:-}" ]; then
            echo "R2 archive SKIPPED: R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY secrets or CLOUDFLARE_ACCOUNT_ID variable is not set."
            echo "The workflow-artifact copy above still stands. See this file's header for provisioning."
            exit 0
          fi
          DUMP="$(ls "${GITHUB_WORKSPACE}/backup-out"/carr-*.sql.age | head -1)"
          KEY="backups/cloud/${STAMP}/$(basename "$DUMP")"
          SIZE="$(wc -c < "$DUMP" | tr -d ' ')"
          ENDPOINT="https://${ACCOUNT_ID}.r2.cloudflarestorage.com"
          echo "archiving $(basename "$DUMP") (${SIZE} bytes) -> r2://carr-documents/${KEY}"
          aws s3api put-object --endpoint-url "$ENDPOINT" \
            --bucket carr-documents --key "$KEY" --body "$DUMP" \
            --content-type application/octet-stream > /dev/null
          # Read back what landed and compare byte counts. An upload that
          # reports success and stores a truncated object is the exact failure
          # the Mac-side size floor exists to catch; the cloud copy gets the
          # same treatment rather than trusting the exit code.
          REMOTE="$(aws s3api head-object --endpoint-url "$ENDPOINT" \
            --bucket carr-documents --key "$KEY" --query ContentLength --output text)"
          if [ "$REMOTE" != "$SIZE" ]; then
            echo "R2 archive FAILED verification: local ${SIZE} bytes, stored ${REMOTE} bytes"
            exit 1
          fi
          echo "R2 archive OK -> ${KEY} (${REMOTE} bytes, read back and matched)"

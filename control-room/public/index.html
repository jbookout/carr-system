<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="CARR Control Room Phase 0 read-only operational prototype">
  <title>CARR Control Room · System operations</title>
  <link rel="stylesheet" href="./css/app.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to operational view</a>
  <div class="shell">
    <aside class="sidebar" aria-label="Control Room navigation">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">CR</span>
        <div>
          <strong>CARR Control Room</strong>
          <span>System operations</span>
        </div>
      </div>
      <nav id="primary-nav"></nav>
      <div class="sidebar-note">
        <strong>Phase 0 prototype</strong>
        <span>Fixture-backed · Read-only</span>
      </div>
    </aside>
    <div class="workspace">
      <header class="topbar">
        <div class="scope">
          <span class="environment-shape" aria-hidden="true">⬢</span>
          <div>
            <span>Environment scope</span>
            <strong id="environment-label">Production</strong>
          </div>
        </div>
        <div class="topbar-controls">
          <label for="scenario-select">Prototype state</label>
          <select id="scenario-select"></select>
          <span class="read-only-badge">Read-only</span>
          <button class="identity" type="button" aria-label="Signed in identity, Joe">Joe</button>
        </div>
      </header>
      <main id="main" tabindex="-1">
        <div id="view-status" class="view-status" role="status" aria-live="polite"></div>
        <div id="app"></div>
      </main>
    </div>
  </div>
  <script type="module" src="./js/app.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07090C">
  <link rel="stylesheet" href="css/room.css?v=queue-v1">
  <link rel="stylesheet" href="css/queue.css?v=queue-v1">
  <title>Queue · Observatory</title>
</head>
<body class="room-body queue-body">
  <a class="skip" href="#queueColumns">Skip to Queue</a>
  <header class="room-header">
    <a class="room-wordmark" href="/workspace">Observa<span>tory</span></a>
    <span class="live-badge" id="queueLive">Connecting</span>
    <p class="room-presence" id="queueSync">Reading the canonical Hermes projection…</p>
    <nav class="room-nav" aria-label="Workspaces">
      <a href="/workspace">Home</a><a href="/leads">Leads</a><a href="/deals">Deals</a><a href="/system-work.html">System work</a><a href="/room.html">Observatory</a><a href="/queue.html" aria-current="page">Queue</a>
    </nav>
  </header>
  <main class="queue-main">
    <section class="queue-toolbar panel" aria-label="Queue controls">
      <label>Target <select id="queueTarget"><option value="">All targets</option></select></label>
      <label>Status <select id="queueStatus"><option value="">All statuses</option></select></label>
      <span id="queueNotice" role="status"></span>
    </section>
    <section class="queue-columns" id="queueColumns" aria-label="Hermes task Queue"></section>
    <aside class="queue-drawer panel" id="queueDrawer" aria-live="polite" hidden>
      <button type="button" id="drawerClose">Close</button><h2 id="drawerTitle"></h2><p id="drawerSummary"></p><dl id="drawerMeta"></dl>
    </aside>
    <form class="queue-compose panel" id="queueComposer">
      <h2>Queue read-only work</h2>
      <label>Target <select id="enqueueTarget"><option value="sol">Sol</option></select></label>
      <label>Title <input id="enqueueTitle" maxlength="200" required></label>
      <label>Details <textarea id="enqueueBody" maxlength="8000" rows="2"></textarea></label>
      <button type="submit">Add to Hermes queue</button>
    </form>
  </main>
  <script type="module" src="js/queue.js?v=queue-v1"></script>
</body>
</html>

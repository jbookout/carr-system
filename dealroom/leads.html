<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07090C">
  <meta name="description" content="DoctorCRE Lead Board — the complete lead pipeline, presented for human qualification.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/leads.css">
  <title>Lead Board · The Deal Room</title>
</head>
<body class="leads-body">
  <a class="skip" href="#leadBoard">Skip to lead board</a>
  <header class="leads-header glass">
    <a class="wordmark" href="/" aria-label="DoctorCRE Home">Doctor<span>CRE</span></a>
    <p class="page-kicker">Lead Board <span id="leadCount">Loading</span></p>
    <nav class="leads-nav" aria-label="Workspaces"><a href="/">Home</a><a href="/leads" aria-current="page">Leads</a><a href="/deals">Deals</a><a href="/system-work.html">System work</a><a href="/room.html">Observatory</a></nav>
  </header>

  <main>
    <section class="pipeline glass" aria-labelledby="pipelineHeading">
      <div><p class="eyebrow">Pipeline field</p><h1 id="pipelineHeading">Every lead, in its current stage.</h1><p class="pipeline-copy">Scores estimate potential. They do not hide people from this board.</p></div>
      <div class="pipeline-track" tabindex="0" aria-label="Scrollable lead pipeline visualization">
      <svg class="pipeline-svg" viewBox="0 0 840 105" role="img" aria-labelledby="pipelineTitle pipelineDesc">
        <title id="pipelineTitle">Lead pipeline flow</title>
        <desc id="pipelineDesc">The lead stages appear in order with arrows between them. The board below presents the same stages as text and controls.</desc>
        <defs><marker id="pipelineArrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z"></path></marker></defs>
        <path class="pipeline-line" d="M55 52 H785" marker-end="url(#pipelineArrow)"></path>
        <g id="pipelineNodes"></g>
      </svg>
      </div>
    </section>

    <section class="controls glass" aria-label="Lead Board filters">
      <label class="search"><span class="sr-only">Search leads</span><input id="leadSearch" type="search" placeholder="Search name, specialty, place…" autocomplete="off"></label>
      <label>Owner <select id="ownerFilter"><option value="">All owners</option></select></label>
      <label>Lane <select id="laneFilter"><option value="">All lanes</option></select></label>
      <label>Stage <select id="stageFilter"><option value="">All stages</option></select></label>
      <div class="view-toggle" role="group" aria-label="Lead Board view">
        <button id="boardView" type="button" class="control-button" aria-pressed="true">Board</button>
        <button id="listView" type="button" class="control-button" aria-pressed="false">List</button>
      </div>
      <button id="densityToggle" type="button" class="control-button" aria-pressed="false">Comfortable density</button>
      <button id="refreshBoard" type="button" class="control-button">Refresh</button>
      <output id="filterSummary" aria-live="polite"></output>
    </section>

    <p id="leadBoardNotice" class="board-notice" role="status" aria-live="polite" hidden></p>
    <p id="leadBoardError" class="board-error" role="alert" hidden></p>
    <div id="leadBoard" class="lead-board" aria-busy="true" aria-describedby="filterSummary leadBoardNotice">
      <p class="board-state loading">Loading the complete lead board…</p>
    </div>
  </main>
  <div id="moveAnnouncement" class="sr-only" role="status" aria-live="polite"></div>
  <script type="module" src="js/leads-app.js"></script>
</body>
</html>

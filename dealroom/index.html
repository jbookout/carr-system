<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#002F6C">
<meta name="description" content="The Deal Room - Joe and Dell's shared pipeline board">
<title>The Deal Room</title>
<link rel="stylesheet" href="css/app.css">
<link rel="manifest" href="manifest.webmanifest">
</head>
<body>
<div class="top">
  <span class="brand">The Deal Room<small>doctorcre.com</small></span>
  <span class="vibes" title="Layout - what the room is">
    <button type="button" class="vibe lay on" data-lay="">Ledger</button>
    <button type="button" class="vibe lay" data-lay="dense">Dense</button>
  </span>
  <span class="vibes" style="margin-left:4px" title="Color - how it is lit; works in either layout">
    <button type="button" class="vibe col ic on" data-col="" title="Light" aria-label="Light scheme">☀️</button>
    <button type="button" class="vibe col ic" data-col="night" title="Dark" aria-label="Dark scheme">🌙</button>
    <button type="button" class="vibe cvd ic" data-col="cvd" title="Color assist - higher-distinction palette and patterns; works with light or dark" aria-label="Color assist">◐</button>
  </span>
  <span class="sp"></span>
  <span class="mode-pill" id="modePill" title="Client mode">Fixture</span>
  <div class="presence">
    <span class="av joe" title="Joe" id="selfAv">J</span>
    <span class="av dell" id="partnerAv" title="Dell">D</span>
    <button type="button" class="mic" id="mic" title="Quill - tap, or hold right-cmd anywhere" aria-label="Quill mic">🎤</button>
  </div>
  <button type="button" class="demo" id="demoBtn">▶ Simulate the call</button>
</div>

<div class="wrap">
  <div id="boardview">
    <div class="stats" id="stats"></div>
    <div class="bar">
      <button type="button" class="chip on" data-f="all">All deals</button>
      <button type="button" class="chip" data-f="joe">Mine</button>
      <button type="button" class="chip" data-f="dell">Dell's</button>
      <button type="button" class="chip" data-f="active">In motion</button>
      <button type="button" class="chip delta" data-f="delta" title="Everything that moved since your last pipeline call - read straight off the event log">Δ Since last call</button>
      <input class="search" id="q" placeholder="Find a deal…" aria-label="Find a deal">
    </div>
    <div class="tframe">
      <table aria-label="Deal pipeline">
        <thead>
          <tr>
            <th style="width:27%">Deal</th>
            <th>Phase</th>
            <th>Type</th>
            <th style="width:26%">Next step</th>
            <th>Next date</th>
            <th>Who</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>
  <div id="dealview"></div>
</div>

<div class="whisper" id="whisper" role="status" aria-live="polite"></div>
<div class="confirms" id="confirms" aria-label="Confirm proposed writes"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>

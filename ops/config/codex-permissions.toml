default_permissions = "carr_drive_readonly"

[permissions.carr_drive_readonly]
description = "CARR Drive is read-only; versioned code and machine config live in carr-system."
extends = ":read-only"

[permissions.carr_drive_readonly.filesystem]
":minimal" = "read"
"{{REPO}}" = "write"

[permissions.carr_drive_readonly.filesystem.":workspace_roots"]
"." = "read"

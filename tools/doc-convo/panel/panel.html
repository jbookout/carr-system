<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dr. CRE</title>
<style>
  /* CARR tokens (ux-doctrine law 11a) — consume, never invent */
  :root {
    --navy: #002F6C; --deep: #00224D; --orange: #F57F29;
    --ink: #EAF0F8; --dim: #8FA3C0; --line: rgba(255,255,255,.08);
    --radius: 10px; --gap: 12px;
    --display: 'Oswald', 'Arial Narrow', 'Avenir Next Condensed', sans-serif;
    --body: 'Montserrat', 'Helvetica Neue', Arial, sans-serif;
  }
  * { margin: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--deep); color: var(--ink);
    font-family: var(--body); font-size: 14px; line-height: 1.45;
    display: flex; flex-direction: column;
  }

  header {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px; background: var(--navy);
    border-bottom: 1px solid var(--line);
  }
  header h1 {
    font-family: var(--display); font-size: 18px; font-weight: 600;
    letter-spacing: .12em;
  }
  #status {
    margin-left: auto; font-size: 11px; letter-spacing: .06em;
    padding: 4px 10px; border-radius: 999px;
    background: rgba(255,255,255,.07); color: var(--dim);
  }
  #status.live { color: var(--orange); }

  main { flex: 1; overflow-y: auto; padding: 14px; scroll-behavior: smooth; }
  @media (prefers-reduced-motion: reduce) { main { scroll-behavior: auto; } }

  .empty { color: var(--dim); text-align: center; margin-top: 38%;
           padding: 0 24px; }
  .empty b { color: var(--ink); font-weight: 600; }

  .turn { margin-bottom: var(--gap); }
  .who {
    font-size: 10px; letter-spacing: .1em; text-transform: uppercase;
    color: var(--dim); margin-bottom: 2px;
  }
  .you .bubble { color: var(--dim); }
  .doc .bubble { color: var(--ink); }
  .bubble { padding: 2px 0 2px 10px; border-left: 2px solid var(--line); }
  .doc .bubble { border-left-color: var(--orange); }

  .card {
    margin-top: 6px; background: var(--navy); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 10px 12px;
  }
  .card h2 {
    font-family: var(--display); font-size: 12px; font-weight: 600;
    letter-spacing: .08em; text-transform: uppercase; color: var(--orange);
    margin-bottom: 6px;
  }
  .card table { width: 100%; border-collapse: collapse; }
  .card td { padding: 3px 0; vertical-align: top; }
  .card td:first-child { color: var(--dim); padding-right: 14px;
                         white-space: nowrap; }
  .card td:last-child { text-align: right; font-variant-numeric: tabular-nums; }

  footer {
    padding: 10px 14px 14px; display: flex; flex-direction: column;
    align-items: center; gap: 6px; background: var(--navy);
    border-top: 1px solid var(--line);
  }
  /* The orb IS the control (Siri pattern, Joe's spec 2026-08-08): alive while
     thinking and talking, color and intensity carrying state and emotion.
     Rendered live on canvas — a generated image can't react; code can. */
  #orb {
    width: 118px; height: 118px; border-radius: 50%; cursor: pointer;
    display: block; background: transparent;
  }
  #orb:focus-visible { outline: 3px solid var(--orange); outline-offset: 4px; }
  #orb.disabled { cursor: default; opacity: .45; }
  #hint { font-size: 11px; color: var(--dim); }

  #offline {
    display: none; margin: 14px; padding: 12px 14px;
    background: var(--navy); border: 1px solid var(--line);
    border-radius: var(--radius); color: var(--dim);
  }
  #offline b { color: var(--ink); }
  #offline code {
    display: block; margin-top: 6px; color: var(--orange);
    font-size: 12px; user-select: all;
  }
</style>
</head>
<body>
<header>
  <!-- Letters-first law (dr-cre-concept v2): written form is DR. CRE in every
       UI. The mark's spot is reserved beside the wordmark until Joe's register
       pick lands (eight candidates, Canva, open since 2026-08-01). -->
  <h1>DR. CRE</h1>
  <span id="status">at the desk</span>
</header>

<div id="offline">
  <b>My engine isn't running.</b> Start it and I'll reconnect on my own:
  <code>~/carr-system/tools/doc-convo/bin/convo-server.py</code>
</div>

<main id="feed">
  <div class="empty" id="empty">
    <b>At the desk.</b><br>
    Tap the orb, say what you need, tap again. I'll keep the numbers on
    cards so you don't have to hold them.
  </div>
</main>

<footer>
  <canvas id="orb" width="236" height="236" role="button" tabindex="0"
          aria-label="Talk to Dr. CRE"></canvas>
  <span id="hint">tap the orb or press space</span>
</footer>

<script>
(function () {
  "use strict";
  var feed = document.getElementById("feed");
  var empty = document.getElementById("empty");
  var orb = document.getElementById("orb");
  var status = document.getElementById("status");
  var offline = document.getElementById("offline");
  var hint = document.getElementById("hint");
  var state = "idle";
  var es = null;

  // Status chip copy: outcome words, never plumbing (law 5/10).
  var LABELS = {
    idle: "at the desk", listening: "listening", thinking: "checking the record",
    rendering: "voice coming", speaking: "speaking"
  };
  var HINTS = {
    idle: "tap the orb or press space", listening: "tap again when done",
    thinking: "", rendering: "", speaking: ""
  };

  /* ── The orb ─────────────────────────────────────────────────────────
     Alive by state, tinted by emotion (Joe's spec 2026-08-08). Each state
     is a parameter set; every frame lerps toward it, so moods FLOW instead
     of switching. Emotion registers (voice doctrine): neutral rides the
     state palette; concern warms amber; critical is the rare hard red.
     Calm-tech law: motion stays slow and small; reduced-motion gets still
     gradients with soft cross-fades only. */
  var STATES = {
    idle:      { colors: ["#1B4F8A", "#2E8B9A", "#163A66"], speed: 0.25,
                 amp: 0.10, core: 0.34, glow: 0.35 },
    listening: { colors: ["#3FB8C9", "#7FD8E0", "#1B4F8A"], speed: 0.85,
                 amp: 0.22, core: 0.46, glow: 0.70 },
    thinking:  { colors: ["#F57F29", "#B45A1D", "#163A66"], speed: 1.6,
                 amp: 0.13, core: 0.30, glow: 0.55 },
    rendering: { colors: ["#F57F29", "#8A4A1A", "#0E2A4C"], speed: 0.9,
                 amp: 0.11, core: 0.36, glow: 0.45 },
    speaking:  { colors: ["#FF9D4D", "#F57F29", "#1B4F8A"], speed: 1.1,
                 amp: 0.26, core: 0.50, glow: 0.85 },
    offline:   { colors: ["#3A4A60", "#2A3648", "#1C2635"], speed: 0.10,
                 amp: 0.04, core: 0.30, glow: 0.15 }
  };
  var REGISTERS = {           // emotion tint layered over any state
    neutral:  null,
    concern:  { colors: ["#E8A33D", "#C77F1F", "#3A2A14"] },
    critical: { colors: ["#E04B3A", "#A03227", "#3A1410"] }
  };
  var register = "neutral";
  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var ctx = orb.getContext("2d");
  var W = orb.width, C = W / 2, R = W * 0.42;
  var t = 0;

  function hex(c) {
    return [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16),
            parseInt(c.slice(5, 7), 16)];
  }
  function rgb(a) {
    return "rgb(" + Math.round(a[0]) + "," + Math.round(a[1]) + "," +
      Math.round(a[2]) + ")";
  }
  function lerp(a, b, k) { return a + (b - a) * k; }

  // Live channels stay NUMERIC ([r,g,b] arrays) — mixing strings back through
  // a hex parser is how the first orb rendered rgb(NaN,...) and died.
  var target = STATES.idle;
  var cur = {
    speed: target.speed, amp: target.amp, core: target.core, glow: target.glow,
    colors: target.colors.map(hex)
  };

  function frame() {
    var reg = REGISTERS[register];
    var goal = reg ? Object.assign({}, target, { colors: reg.colors }) : target;
    var k = 0.06;                       // ~600ms mood transitions
    cur.speed = lerp(cur.speed, goal.speed, k);
    cur.amp = lerp(cur.amp, goal.amp, k);
    cur.core = lerp(cur.core, goal.core, k);
    cur.glow = lerp(cur.glow, goal.glow, k);
    for (var i = 0; i < 3; i++) {
      var gh = hex(goal.colors[i]);
      for (var c3 = 0; c3 < 3; c3++) {
        cur.colors[i][c3] = lerp(cur.colors[i][c3], gh[c3], k);
      }
    }

    t += reduced ? 0 : cur.speed * 0.016;
    ctx.clearRect(0, 0, W, W);
    ctx.save();
    ctx.beginPath(); ctx.arc(C, C, R, 0, 7); ctx.clip();

    // deep body
    var g = ctx.createRadialGradient(C, C, 0, C, C, R);
    g.addColorStop(0, rgb(cur.colors[0])); g.addColorStop(1, rgb(cur.colors[2]));
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, W);

    // three drifting inner lights — the "alive" part
    ctx.globalCompositeOperation = "lighter";
    for (var j = 0; j < 3; j++) {
      var a = t * (0.7 + j * 0.35) + j * 2.1;
      var rr = R * cur.amp * (1.6 + Math.sin(t * 0.9 + j) * 0.5);
      var x = C + Math.cos(a) * R * cur.amp * 2.2;
      var y = C + Math.sin(a * 0.8 + j) * R * cur.amp * 2.2;
      var bg = ctx.createRadialGradient(x, y, 0, x, y, R * cur.core);
      bg.addColorStop(0, rgb(cur.colors[1]));
      bg.addColorStop(1, "rgba(0,0,0,0)");
      ctx.globalAlpha = 0.55;
      ctx.fillStyle = bg;
      ctx.beginPath(); ctx.arc(x, y, R * cur.core + rr, 0, 7); ctx.fill();
    }
    ctx.restore();

    // outer glow ring
    ctx.globalCompositeOperation = "source-over";
    ctx.globalAlpha = cur.glow * (0.75 + (reduced ? 0 : Math.sin(t * 2) * 0.25));
    ctx.strokeStyle = rgb(cur.colors[1]);
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(C, C, R + 2, 0, 7); ctx.stroke();
    ctx.globalAlpha = 1;

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  function setState(s) {
    state = s;
    status.textContent = LABELS[s] || s;
    status.className = s === "idle" ? "" : "live";
    hint.textContent = HINTS[s] !== undefined ? HINTS[s] : "";
    target = STATES[s] || STATES.idle;
    orb.classList.toggle("disabled", !(s === "idle" || s === "listening"));
  }

  function addTurn(turn) {
    empty.style.display = "none";
    var div = document.createElement("div");
    div.className = "turn";
    if (turn.you) {
      var y = document.createElement("div"); y.className = "you";
      y.innerHTML = '<div class="who">You</div>';
      var yb = document.createElement("div"); yb.className = "bubble";
      yb.textContent = turn.you; y.appendChild(yb); div.appendChild(y);
    }
    if (turn.doc) {
      var d = document.createElement("div"); d.className = "doc";
      d.innerHTML = '<div class="who">Dr. CRE</div>';
      var db = document.createElement("div"); db.className = "bubble";
      db.textContent = turn.doc; d.appendChild(db);
      if (turn.card && turn.card.rows) {
        var c = document.createElement("div"); c.className = "card";
        if (turn.card.title) {
          var h = document.createElement("h2");
          h.textContent = turn.card.title; c.appendChild(h);
        }
        var t = document.createElement("table");
        turn.card.rows.forEach(function (row) {
          var tr = document.createElement("tr");
          var a = document.createElement("td"); a.textContent = row[0];
          var b = document.createElement("td"); b.textContent = row[1];
          tr.appendChild(a); tr.appendChild(b); t.appendChild(tr);
        });
        c.appendChild(t); d.appendChild(c);
      }
      div.appendChild(d);
    }
    feed.appendChild(div);
    feed.scrollTop = feed.scrollHeight;
  }

  function post(action) {
    return fetch("/talk", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ action: action })
    }).catch(function () { setOffline(true); });
  }

  function toggle() {
    if (orb.classList.contains("disabled")) return;
    if (state === "idle") { register = "neutral"; post("start"); }
    else if (state === "listening") post("stop");
  }
  orb.addEventListener("click", toggle);
  orb.addEventListener("keydown", function (e) {
    if (e.code === "Space" || e.code === "Enter") { e.preventDefault(); toggle(); }
  });
  document.addEventListener("keydown", function (e) {
    if (e.code === "Space" && e.target === document.body) {
      e.preventDefault(); toggle();
    }
  });

  function setOffline(is) {
    offline.style.display = is ? "block" : "none";
    orb.classList.toggle("disabled", is);
    hint.textContent = is ? "waiting for the engine" : HINTS[state] || "";
    if (is) {
      status.textContent = "offline"; status.className = "";
      target = STATES.offline;
    }
  }

  function connect() {
    fetch("/state").then(function (r) { return r.json(); }).then(function (s) {
      setOffline(false);
      setState(s.state || "idle");
      (s.turns || []).forEach(addTurn);
      es = new EventSource("/events");
      es.addEventListener("state", function (e) {
        setState(JSON.parse(e.data).state);
      });
      es.addEventListener("turn", function (e) {
        var turn = JSON.parse(e.data);
        // Emotion register: the brain may mark a turn concern/critical (voice
        // doctrine registers); the orb wears it until the next conversation.
        if (turn.register && REGISTERS[turn.register] !== undefined) {
          register = turn.register;
        }
        addTurn(turn);
      });
      es.onerror = function () {
        es.close(); setOffline(true); setTimeout(connect, 3000);
      };
    }).catch(function () {
      setOffline(true); setTimeout(connect, 3000);
    });
  }
  setState("idle");
  connect();
})();
</script>
</body>
</html>

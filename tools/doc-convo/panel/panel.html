<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dr. CRE</title>
<style>
  /* CARR tokens (ux-doctrine law 11a) — consume, never invent */
  :root {
    --navy: #002F6C; --deep: #00224D; --orange: #F57F29;
    --ink: #EAF0F8; --dim: #8FA3C0; --line: rgba(255,255,255,.08);
    --radius: 10px; --gap: 12px;
    --display: 'Oswald', 'Arial Narrow', 'Avenir Next Condensed', sans-serif;
    --body: 'Montserrat', 'Helvetica Neue', Arial, sans-serif;
  }
  * { margin: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--deep); color: var(--ink);
    font-family: var(--body); font-size: 14px; line-height: 1.45;
    display: flex; flex-direction: column;
  }

  header {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px; background: var(--navy);
    border-bottom: 1px solid var(--line);
  }
  header h1 {
    font-family: var(--display); font-size: 18px; font-weight: 600;
    letter-spacing: .12em;
  }
  #status {
    margin-left: auto; font-size: 11px; letter-spacing: .06em;
    padding: 4px 10px; border-radius: 999px;
    background: rgba(255,255,255,.07); color: var(--dim);
  }
  #status.live { color: var(--orange); }

  main { flex: 1; overflow-y: auto; padding: 14px; scroll-behavior: smooth; }
  @media (prefers-reduced-motion: reduce) { main { scroll-behavior: auto; } }

  .empty { color: var(--dim); text-align: center; margin-top: 38%;
           padding: 0 24px; }
  .empty b { color: var(--ink); font-weight: 600; }

  .turn { margin-bottom: var(--gap); }
  .who {
    font-size: 10px; letter-spacing: .1em; text-transform: uppercase;
    color: var(--dim); margin-bottom: 2px;
  }
  .you .bubble { color: var(--dim); }
  .doc .bubble { color: var(--ink); }
  .bubble { padding: 2px 0 2px 10px; border-left: 2px solid var(--line); }
  .doc .bubble { border-left-color: var(--orange); }

  .card {
    margin-top: 6px; background: var(--navy); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 10px 12px;
  }
  .card h2 {
    font-family: var(--display); font-size: 12px; font-weight: 600;
    letter-spacing: .08em; text-transform: uppercase; color: var(--orange);
    margin-bottom: 6px;
  }
  .card table { width: 100%; border-collapse: collapse; }
  .card td { padding: 3px 0; vertical-align: top; }
  .card td:first-child { color: var(--dim); padding-right: 14px;
                         white-space: nowrap; }
  .card td:last-child { text-align: right; font-variant-numeric: tabular-nums; }

  footer {
    padding: 14px; display: flex; flex-direction: column; align-items: center;
    gap: 8px; background: var(--navy); border-top: 1px solid var(--line);
  }
  #talk {
    width: 76px; height: 76px; border-radius: 50%; border: none;
    background: var(--orange); color: #fff; cursor: pointer;
    font-family: var(--display); font-size: 12px; letter-spacing: .08em;
    text-transform: uppercase;
    transition: transform .12s ease, box-shadow .12s ease;
  }
  #talk:hover { transform: scale(1.04); }
  #talk:active { transform: scale(.97); }
  #talk:focus-visible { outline: 3px solid var(--orange); outline-offset: 3px; }
  #talk:disabled { background: #5a6e8c; cursor: default; transform: none; }
  #talk.listening { box-shadow: 0 0 0 6px rgba(245,127,41,.25); }
  @media (prefers-reduced-motion: no-preference) {
    #talk.listening { animation: breathe 1.6s ease-in-out infinite; }
    @keyframes breathe {
      0%,100% { box-shadow: 0 0 0 4px rgba(245,127,41,.18); }
      50%     { box-shadow: 0 0 0 10px rgba(245,127,41,.30); }
    }
  }
  #hint { font-size: 11px; color: var(--dim); }

  #offline {
    display: none; margin: 14px; padding: 12px 14px;
    background: var(--navy); border: 1px solid var(--line);
    border-radius: var(--radius); color: var(--dim);
  }
  #offline b { color: var(--ink); }
  #offline code {
    display: block; margin-top: 6px; color: var(--orange);
    font-size: 12px; user-select: all;
  }
</style>
</head>
<body>
<header>
  <!-- Letters-first law (dr-cre-concept v2): written form is DR. CRE in every
       UI. The mark's spot is reserved beside the wordmark until Joe's register
       pick lands (eight candidates, Canva, open since 2026-08-01). -->
  <h1>DR. CRE</h1>
  <span id="status">at the desk</span>
</header>

<div id="offline">
  <b>My engine isn't running.</b> Start it and I'll reconnect on my own:
  <code>~/carr-system/tools/doc-convo/bin/convo-server.py</code>
</div>

<main id="feed">
  <div class="empty" id="empty">
    <b>At the desk.</b><br>
    Tap the button, say what you need, tap again. I'll keep the numbers on
    cards so you don't have to hold them.
  </div>
</main>

<footer>
  <button id="talk" aria-label="Talk to Doc">Talk</button>
  <span id="hint">space works too</span>
</footer>

<script>
(function () {
  "use strict";
  var feed = document.getElementById("feed");
  var empty = document.getElementById("empty");
  var talk = document.getElementById("talk");
  var status = document.getElementById("status");
  var offline = document.getElementById("offline");
  var hint = document.getElementById("hint");
  var state = "idle";
  var es = null;

  // Status chip copy: outcome words, never plumbing (law 5/10).
  var LABELS = {
    idle: "at the desk", listening: "listening", thinking: "checking the record",
    rendering: "voice coming", speaking: "speaking"
  };
  var BUTTON = { idle: "Talk", listening: "Done", thinking: "…",
                 rendering: "…", speaking: "…" };

  function setState(s) {
    state = s;
    status.textContent = LABELS[s] || s;
    status.className = s === "idle" ? "" : "live";
    talk.textContent = BUTTON[s] || "Talk";
    talk.disabled = !(s === "idle" || s === "listening");
    talk.classList.toggle("listening", s === "listening");
  }

  function addTurn(turn) {
    empty.style.display = "none";
    var div = document.createElement("div");
    div.className = "turn";
    if (turn.you) {
      var y = document.createElement("div"); y.className = "you";
      y.innerHTML = '<div class="who">You</div>';
      var yb = document.createElement("div"); yb.className = "bubble";
      yb.textContent = turn.you; y.appendChild(yb); div.appendChild(y);
    }
    if (turn.doc) {
      var d = document.createElement("div"); d.className = "doc";
      d.innerHTML = '<div class="who">Dr. CRE</div>';
      var db = document.createElement("div"); db.className = "bubble";
      db.textContent = turn.doc; d.appendChild(db);
      if (turn.card && turn.card.rows) {
        var c = document.createElement("div"); c.className = "card";
        if (turn.card.title) {
          var h = document.createElement("h2");
          h.textContent = turn.card.title; c.appendChild(h);
        }
        var t = document.createElement("table");
        turn.card.rows.forEach(function (row) {
          var tr = document.createElement("tr");
          var a = document.createElement("td"); a.textContent = row[0];
          var b = document.createElement("td"); b.textContent = row[1];
          tr.appendChild(a); tr.appendChild(b); t.appendChild(tr);
        });
        c.appendChild(t); d.appendChild(c);
      }
      div.appendChild(d);
    }
    feed.appendChild(div);
    feed.scrollTop = feed.scrollHeight;
  }

  function post(action) {
    return fetch("/talk", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ action: action })
    }).catch(function () { setOffline(true); });
  }

  function toggle() {
    if (state === "idle") post("start");
    else if (state === "listening") post("stop");
  }
  talk.addEventListener("click", toggle);
  document.addEventListener("keydown", function (e) {
    if (e.code === "Space" && e.target === document.body) {
      e.preventDefault(); toggle();
    }
  });

  function setOffline(is) {
    offline.style.display = is ? "block" : "none";
    talk.disabled = is;
    hint.textContent = is ? "waiting for the engine" : "space works too";
    if (is) { status.textContent = "offline"; status.className = ""; }
  }

  function connect() {
    fetch("/state").then(function (r) { return r.json(); }).then(function (s) {
      setOffline(false);
      setState(s.state || "idle");
      (s.turns || []).forEach(addTurn);
      es = new EventSource("/events");
      es.addEventListener("state", function (e) {
        setState(JSON.parse(e.data).state);
      });
      es.addEventListener("turn", function (e) { addTurn(JSON.parse(e.data)); });
      es.onerror = function () {
        es.close(); setOffline(true); setTimeout(connect, 3000);
      };
    }).catch(function () {
      setOffline(true); setTimeout(connect, 3000);
    });
  }
  setState("idle");
  connect();
})();
</script>
</body>
</html>

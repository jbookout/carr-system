# CARR MCP server — Cloudflare Worker (skeleton deployed 2026-07-30)
# Secrets (via `wrangler secret put`, never in this file, never in git):
#   DATABASE_URL_READER — Neon login role granted carr_reader (views only)
#   DATABASE_URL_WRITER — Neon login role granted carr_writer (write path; set when verbs land)
#   INGEST_TOKENS       — JSON map { "<source>": "<token>" } for the ingest socket
#   PROBE_TOKENS        — JSON map { "<slug>": "<token>" } for the smoke suite ONLY
#                         (loop #192, 2026-08-06). Authenticates as one locked-
#                         profile machine actor ('smoke-probe'); checked in
#                         index.js before the OAuthProvider ever sees the request.
#                         See secrets-inventory.md and mcp-server/smoke-reads.sh's
#                         header for the provisioning runbook.
#   REVIEW_TOKENS       — JSON map { "<slug>": "<token>" } for the Automatic Review
#                         Council (built 2026-08-06). Same shape and same
#                         before-the-OAuthProvider check as PROBE_TOKENS, modeled
#                         directly on it. Authenticates a reviewer actor
#                         ('codex-reviewer', 'grok-reviewer') locked server-side to
#                         the 'reviewer' profile: ALL reads + EXACTLY record-finding.
#                         TWO KEYS as of the 2026-08-06 scope extension — Codex was
#                         the original frozen scope; Grok joined the same day once
#                         its subscription-covered headless path (OAuth device
#                         flow, no XAI_API_KEY) was live-verified. Paste both keys
#                         together: {"codex-reviewer":"<t1>","grok-reviewer":"<t2>"}.
#                         See pipelines/provision-review-council.sql and
#                         bin/review-council-runner.sh for the provisioning runbook.
#                         PROVISIONED AND ACTIVE as of 2026-08-06 (#214 audit,
#                         verified live: both reviewer actors exist, active=t).
#   LOCAL_TOKENS        — JSON map with one key per local machine door:
#                         { "joe-local": "<t1>", "dell-local": "<t2>" }.
#                         Joe's door began Phase 1, 2026-08-13 (decision
#                         97e76a2f); Dell's separate sponsored door followed
#                         2026-08-18.
#                         Same shape and same before-the-OAuthProvider check as
#                         PROBE_TOKENS/REVIEW_TOKENS. Authenticates
#                         mcp-server/local-verb.mjs (via tools/call-verb.py /
#                         `run.sh call`) as the machine's own actor: joe-local
#                         sponsored to Joe, or dell-local sponsored to Dell
#                         (identity.js's LOCAL_SPONSOR); both are human:false
#                         with full verb parity minus humanOnly.
#                         This CLOSES the direct-database bypass local-verb.mjs
#                         used to run: it is now a thin HTTPS client of this
#                         Worker, same as any other caller. The direct-database
#                         path survives only as explicit, receipted break-glass
#                         — see local-verb.mjs's own header. Additive secret;
#                         never widen AGENT_TOKENS for this (see index.js's
#                         "local token" comment for why). Provisioning:
#                         pipelines/provision-local-client.sql for Joe or
#                         pipelines/provision-dell-local-client.sql for Dell
#                         (both mirror provision-smoke-probe.sql) + a key in
#                         ~/.config/carr/mcp-tokens.env (CARR_MCP_LOCAL_TOKEN).
#   (PARTNER_TOKENS     — RETIRED 2026-08-03. Was an interim per-partner bearer
#                         for /mcp during the OAuth rollout. Both partners are on
#                         provider-issued tokens; the secret is deleted and the
#                         code path is gone. Listed here only so the next reader
#                         of an old commit knows where it went. PROBE_TOKENS above
#                         is NOT its replacement — it authenticates as its own
#                         narrow machine actor, never as a full human actor.)
#   GOOGLE_CLIENT_ID    — Google Cloud OAuth 2.0 web client (upstream sign-in)
#   GOOGLE_CLIENT_SECRET— ditto. Joe sets both himself; Claude never holds them.
name = "carr-mcp"
account_id = "12ccca77eb49142a6be8eb84c0d6a3a0"
main = "src/index.js"
compatibility_date = "2026-07-01"

# Required by workers-oauth-provider for Client ID Metadata Document support:
# it disables the legacy same-zone fetch shortcut, which is the SSRF guard for
# fetching a client's metadata document.
compatibility_flags = ["global_fetch_strictly_public"]

# Custom domains. api.* is the machine surface; reports.* (client links) is a
# separate Pages project per open-loops #105; the apex stays free for the future
# public site. doctorcre.com added 2026-08-01 (Joe's domain ruling): PRIMARY name
# as of Dell's onboarding — practicecre.com stays live as an alias; its
# retirement is a later, unhurried decision. Same Worker answers both.
routes = [
  { pattern = "api.practicecre.com", custom_domain = true },
  { pattern = "api.doctorcre.com", custom_domain = true },
  { pattern = "dealroom.doctorcre.com", custom_domain = true }
]

# WHICH DEPLOYMENT IS ANSWERING. Added 2026-08-14, after the routes incident
# below: for about two minutes api.doctorcre.com was served by carr-mcp-staging
# and /release — the endpoint that exists to answer "what is production
# running?" — could not say so. Its only symptom was doctrine_generation null,
# which reads as a DATABASE fault on production, not as "you are talking to a
# different Worker". Every other field was plausible or outright identical:
# git_sha is the same commit in both environments, and schema is identical BY
# CONSTRUCTION, because staging's database is built from db/schema.sql, which
# carries production's committed schema_migrations ledger.
#
# `vars` IS INHERITABLE, exactly like `routes`. An env-level [env.X.vars] table
# REPLACES this one wholesale rather than merging into it, so any var added here
# later must also be added to [env.staging.vars] or staging silently loses it.
# That is the same inheritance surprise documented at length below; it is written
# here too because the next person to add a var will be reading this block, not
# that one.
[vars]
CARR_ENV = "production"
DEALROOM_HOST = "dealroom.doctorcre.com"
# A reviewed, public deployment setting. Program 6 is enabled only through the
# immutable release that fingerprints this exact config value; the shared
# parser still fails closed for a missing or non-literal value.
DEALROOM_PROGRAM6_ACTIONS_ENABLED = "true"

# Cloudflare supplies the immutable version ID, optional tag, and creation
# timestamp at runtime. /release reads this binding as provider identity; it is
# deliberately separate from GIT_SHA, which is source provenance stamped by the
# deploy wrapper.
[version_metadata]
binding = "CF_VERSION_METADATA"

# One Worker + one asset binding is the smallest deployable structure. The
# parallel Deal Room lane writes its no-build bundle directly under dealroom/;
# src/dealroom-web.js also checks dist/ and falls back to public-shell/index.html.
[assets]
directory = "../dealroom"
binding = "ASSETS"
run_worker_first = true

# OAuth grant/token storage for workers-oauth-provider. The binding name is
# fixed by the library — it reads env.OAUTH_KV directly. Created 2026-07-31.
# Secrets are stored only as hashes; grant props are encrypted at rest.
[[kv_namespaces]]
binding = "OAUTH_KV"
id = "b033d3b5c454445080e9d0ab51ff8f3c"

[observability]
enabled = true

[[r2_buckets]]
binding = "carr_documents"
bucket_name = "carr-documents"

# ─────────────────────────────────────────────────────────────────────────────
# STAGING (2026-08-13). Gate G1 requires an environment PROVEN unable to reach
# Production data or credentials. The database half is a separate Neon project
# (carr-staging, resolved by name in tools/db-tap.py); this is the Worker half.
#
# EVERY BINDING BELOW IS ITS OWN. Nothing is shared with the block above — not
# the KV namespace, not the domains, not one secret. `wrangler deploy --env
# staging` deploys a SEPARATE Worker named carr-mcp-staging; the production
# Worker is untouched by it. A staging environment that shares any one of these
# is not a staging environment, it is production with a different label.
#
# NO CUSTOM DOMAINS, DELIBERATELY. Staging answers on workers.dev only. Putting
# it on staging-api.doctorcre.com would mean a DNS record one typo away from the
# production hostnames and a certificate on the same zone; workers.dev costs
# nothing, needs no DNS, and is unmistakably not production at a glance.
#
# NO R2 BUCKET. The production carr_documents binding is declared but referenced
# nowhere in src/ (checked). Staging gets one when the code actually uses it —
# an unused binding is a surface to keep isolated for no benefit.
#
# SECRETS ARE SET BY bin/staging-secrets.sh, which generates fresh values and
# pipes them straight into `wrangler secret put`. They are never copies of
# production's, because a leaked staging token must never open production, and
# they are never printed — see that script's header.
[env.staging]
name = "carr-mcp-staging"
main = "src/index.js"
compatibility_date = "2026-07-01"
compatibility_flags = ["global_fetch_strictly_public"]
workers_dev = true

# `routes = []` IS LOAD-BEARING AND CAUSED A PRODUCTION INCIDENT BY ITS ABSENCE.
# 2026-08-13 00:27 UTC: this block was first written without it, on the
# assumption that declaring no routes meant inheriting none. Wrangler treats
# `routes` as an INHERITABLE key, so the staging Worker inherited all three
# production custom domains and took them over on deploy — api.doctorcre.com,
# api.practicecre.com and dealroom.doctorcre.com all began answering from
# carr-mcp-staging, which is bound to the EMPTY staging database. /release on
# api.doctorcre.com returned doctrine_generation null, "doctrine_meta has no row
# with id=1", for about two minutes until production was redeployed and
# reclaimed them.
#
# An empty list OVERRIDES the inherited value; omitting the key inherits it. The
# difference between those two is a live outage, so it is written down here
# rather than left to whoever reads the wrangler docs next. Never delete this
# line to "tidy up" — its emptiness is the whole point.
routes = []

# Staging says so out loud, on every /release call. See the [vars] note in the
# production block: this table REPLACES the top-level one rather than merging,
# so a var added there must be repeated here.
[env.staging.vars]
CARR_ENV = "staging"
DEALROOM_HOST = "carr-mcp-staging.joe-bookout-carr-us.workers.dev"
DEALROOM_PROGRAM6_ACTIONS_ENABLED = "true"

# Environment configuration is explicit: staging's separate Worker needs the
# same runtime version-identity binding and must not depend on inheritance.
[env.staging.version_metadata]
binding = "CF_VERSION_METADATA"

[env.staging.assets]
directory = "../dealroom"
binding = "ASSETS"
run_worker_first = true

# Its OWN OAuth store. Sharing production's namespace would mean a staging grant
# is a production grant — the single worst way to fail this gate.
[[env.staging.kv_namespaces]]
binding = "OAUTH_KV"
id = "faa513fd07ec45d88abc5949f323aec5"

[env.staging.observability]
enabled = true
